plugins { id 'com.android.application' }

def geminiKeyFile = rootProject.file('../.secrets/gemini-api-key')
def geminiAssets = layout.buildDirectory.dir('generated/geminiAssets')
def generateGeminiKey = tasks.register('generateGeminiKey') {
    inputs.files(geminiKeyFile).optional()
    outputs.dir(geminiAssets)
    doLast {
        def key = geminiKeyFile.exists() ? geminiKeyFile.getText('UTF-8').trim() : ''
        if (key.contains('\n') || key.contains('\r') || key.length() > 4096) {
            throw new GradleException('Local Gemini API key must be on one line; edit .secrets/gemini-api-key.')
        }
        def dir = geminiAssets.get().asFile
        dir.mkdirs()
        new File(dir, 'gemini-api-key').setText(key, 'UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn(generateGeminiKey) }
android {
    namespace 'io.muse.x04g'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'io.muse.x04g'
        minSdk 29
        targetSdk 29
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'io.muse.x04g.TtsCheck'
        ndk { abiFilters 'armeabi-v7a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { assets.srcDirs = ['src/main/assets', '../../upstream/muse-gadget-sdk/linux/tests/vectors', geminiAssets] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation 'com.squareup.okhttp3:okhttp:4.12.0' }
